[project]
name = "adpb"
version = "0.1.0"
description = "Autonomous Data Pipeline Builder: a bounded multi-agent system that turns a plain-English data request into a tested, versioned pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Harshil Agrawal" },
    { name = "Siddharth Pal" },
    { name = "Vasu Patel" },
]
dependencies = [
    "anthropic",
    "openai",
    "pydantic",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "mcp",
    "mcp-server-git",
    "chromadb",
    "pandas",
    "pyarrow",
    "pyyaml",
    "python-dotenv",
    "streamlit",
    "httpx",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
]

[project.scripts]
adpb = "adpb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adpb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -m 'not live'"
timeout = 120
markers = [
    "docker: needs a running Docker daemon (real sandbox containers)",
    "live: calls a real LLM API and spends money; run explicitly with -m live",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.coverage.run]
source = ["src/adpb"]
branch = true
