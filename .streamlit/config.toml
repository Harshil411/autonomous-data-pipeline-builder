# Two looks: Night (dark, the default) and Day (light). Our own markup is styled in
# app/theme.py; the [theme.dark] and [theme.light] sections below make Streamlit's built-in
# widgets (inputs, tables, tabs) match whichever look is active. Keep the colours here in
# step with THEMES in app/theme.py.
[theme]
baseRadius = "0.7rem"
showWidgetBorder = true
# Geist and Geist Mono are bundled in app/static/ (SIL Open Font License), so the booth
# laptop needs no internet. The browser falls back to its system fonts if they fail to load.
font = "Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif"
codeFont = "'Geist Mono', ui-monospace, Menlo, monospace"
baseFontSize = 16

[[theme.fontFaces]]
family = "Geist"
url = "app/static/Geist.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/GeistMono.woff2"
weight = "100 900"
style = "normal"

[theme.dark]
primaryColor = "#FF8A3D"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#131316"
textColor = "#EDEDEF"
borderColor = "#34343B"
linkColor = "#FFB37A"

[theme.light]
primaryColor = "#E5650F"
backgroundColor = "#F6F6F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#131316"
borderColor = "#D2D2D9"
linkColor = "#9A4300"

[server]
headless = true
runOnSave = false
enableStaticServing = true

[browser]
gatherUsageStats = false
